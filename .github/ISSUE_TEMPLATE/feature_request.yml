name: 💡 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索 [现有 Issue](https://github.com/JackyTJie/SJTURunningMan_Advanced_Edition/issues)，避免重复。

  - type: dropdown
    id: platform
    attributes:
      label: 目标平台
      description: 这个建议针对哪个平台？
      options:
        - 电脑版（Windows / macOS / Linux）
        - 安卓
        - iOS
        - 鸿蒙 NEXT
        - 全部平台
        - 文档 / 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      description: 描述痛点，而不是直接跳到方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 你希望它怎么工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你还考虑过哪些做法？
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意自己提交 PR 实现这个功能
          required: false
