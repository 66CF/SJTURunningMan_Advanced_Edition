name: Native desktop checks
on:
  push:
    paths: ['.cargo/**', 'desktop/**', 'Cargo.toml', 'Cargo.lock', 'src/config.py', 'scripts/package_desktop.py', 'scripts/test_*.py', 'assets/Routes/default.txt', 'assets/SJTURM.*', 'route_planner.html', 'build_windows.ps1', '.github/workflows/desktop-check.yml']
  pull_request:
    paths: ['.cargo/**', 'desktop/**', 'Cargo.toml', 'Cargo.lock', 'src/config.py', 'scripts/package_desktop.py', 'scripts/test_*.py', 'assets/Routes/default.txt', 'assets/SJTURM.*', 'route_planner.html', 'build_windows.ps1', '.github/workflows/desktop-check.yml']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test packaging layouts
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev xvfb fonts-noto-cjk
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Smoke test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath target/release/sjturunningman.exe -ArgumentList '--smoke-test', 'target/smoke' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Desktop smoke test failed' }
          if (-not (Test-Path target/smoke/smoke-result.json)) { throw 'Missing smoke test result' }
      - name: Smoke test on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a target/release/sjturunningman --smoke-test target/smoke
      - uses: actions/upload-artifact@v7
        if: always() && runner.os != 'macOS'
        with:
          name: desktop-smoke-${{ runner.os }}
          path: target/smoke/*.png
