name: Release

# 推 tag 触发，`4.5.0` 与 `v4.5.0` 两种写法都认；也可手动指定已有 tag 重跑。
#
# 正确顺序：
#   推 tag  ->  本工作流构建  ->  生成 draft release 并挂上 5 个产物
#          ->  人工审核  ->  点发布
#
# ⚠️ 不要反过来先手动建好 release 再推 tag：action-gh-release 遇到已存在的
#    release 会去更新它，而下面的 draft: true 会把已发布的 release 打回草稿。
#
# 产物五类 + 一份校验文件：
#   SJTURunningMan_<ver>_windows.exe          Windows
#   SJTURunningMan_<ver>_macOS.dmg            macOS（universal2）
#   SJTURunningMan_<ver>_linux_amd64.deb      Linux x86_64
#   SJTURunningMan_<ver>_linux_arm64.deb      Linux aarch64
#   SJTURunningMan_<ver>_android.apk          安卓（自签名，可覆盖升级）
#   SHA256SUMS.txt                            以上全部的 SHA256
#
# 每个产物都由 actions/attest-build-provenance 生成来源证明：证书来自 GitHub
# OIDC，绑定本次运行与提交，本机无法伪造。用户可用 gh attestation verify 校验。
on:
  push:
    tags:
      - '[0-9]*'   # 4.5.0 —— 本仓库历史上一直是这种写法
      - 'v*'       # v4.5.0 —— 一并兼容
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的已有 tag（如 4.5.0 或 v4.5.0）'
        required: true
        type: string

# 全局默认只读；需要写权限的作业各自提升，见各 job 下的 permissions。
# 这样 id-token / attestations 这类敏感权限只落在真正需要它们的构建作业上。
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14.6'

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"   # workflow_dispatch 时 GITHUB_REF_NAME 是分支名，需覆盖
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: meta
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write        # 换 OIDC token，用于签署来源证明
      attestations: write    # 存储来源证明
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Write version into config
        shell: pwsh
        run: Set-Content -Path src/config.py -Value ('global_version = "v{0}"' -f '${{ needs.meta.outputs.version }}')
      - name: Install deps
        run: |
          python -m pip install -r requirements.txt pyinstaller
      - name: Build exe
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: python -m PyInstaller --clean --noconfirm main.spec
      - name: Rename artifact
        shell: pwsh
        run: Copy-Item dist/SJTURunningMan.exe ("SJTURunningMan_{0}_windows.exe" -f '${{ needs.meta.outputs.version }}')
      - name: 生成来源证明
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: SJTURunningMan_*_windows.exe
      - uses: actions/upload-artifact@v7
        with:
          name: win
          path: SJTURunningMan_*_windows.exe
          # 打包步骤静默失败、产物没生成时直接失败，不要发一个缺平台的 release
          if-no-files-found: error

  build-macos:
    needs: meta
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      # 关键：python.org 官方 pkg 是 universal2，PySide6 wheel 也是 universal2，
      # 这样 PyInstaller --target-architecture universal2 才能出真双架构包。
      # setup-python 在 mac runner 上不保证 universal2，故直接装官方 pkg。
      - name: Install universal2 Python
        run: |
          curl -fsSL -o python.pkg "https://www.python.org/ftp/python/${PYTHON_VERSION}/python-${PYTHON_VERSION}-macos11.pkg"
          sudo installer -pkg python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/${PYTHON_VERSION%.*}/bin" >> "$GITHUB_PATH"
      - name: Check python arch
        run: lipo -archs /Library/Frameworks/Python.framework/Versions/${PYTHON_VERSION%.*}/Python
      - name: Write version into config
        run: printf 'global_version = "v%s"\n' '${{ needs.meta.outputs.version }}' > src/config.py
      - name: Install deps
        run: |
          python3 -m pip install -r requirements.txt pyinstaller
      - name: Build app + dmg
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          python3 -m PyInstaller --clean --noconfirm main.spec
          ARCHS=$(lipo -archs dist/SJTURunningMan.app/Contents/MacOS/SJTURunningMan)
          echo "app archs: $ARCHS"
          echo "$ARCHS" | grep -q x86_64 && echo "$ARCHS" | grep -q arm64 || { echo "not universal2"; exit 1; }
          hdiutil create -volname "SJTURunningMan ${VERSION}" \
            -srcfolder dist/SJTURunningMan.app -ov -format UDZO \
            "SJTURunningMan_${VERSION}_macOS.dmg"
      - name: 生成来源证明
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: SJTURunningMan_*_macOS.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: SJTURunningMan_*_macOS.dmg
          if-no-files-found: error

  # ── Linux 两个架构各构建一次 ─────────────────────────────────────────────
  # 必须是原生 arm64 runner：PyInstaller 不能交叉编译，
  # 而 PySide6 的 aarch64 wheel 是 manylinux_2_39（要求 glibc >= 2.39），
  # 所以只能跑 ubuntu-24.04 —— ubuntu-22.04 的 glibc 2.35 装不上。
  # amd64 那条也显式钉住 24.04，避免 ubuntu-latest 将来漂移改变 glibc 基线。
  build-linux-amd64:
    needs: meta
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Write version into config
        run: printf 'global_version = "v%s"\n' '${{ needs.meta.outputs.version }}' > src/config.py
      - name: Install deps
        run: |
          python -m pip install -r requirements.txt pyinstaller
      - name: Build binary
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: python -m PyInstaller --clean --noconfirm main.spec
      - name: Package deb
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          mkdir -p pkgroot/usr/bin pkgroot/usr/share/applications pkgroot/usr/share/pixmaps
          cp dist/SJTURunningMan pkgroot/usr/bin/sjturunningman
          cp assets/SJTURM.png pkgroot/usr/share/pixmaps/sjturunningman.png
          cat > pkgroot/usr/share/applications/sjturunningman.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=SJTU 校园轻松跑
          Exec=sjturunningman
          Icon=sjturunningman
          Terminal=false
          Categories=Education;
          EOF
          fpm -s dir -t deb -n sjturunningman -v "$VERSION" -a amd64 \
            --maintainer 'Jacky Tang <tang.jie@live.com>' \
            --url 'https://github.com/JackyTJie/SJTURunningMan_Advanced_Edition' \
            --description 'SJTU 校园轻松跑' \
            --depends libgl1 --depends libegl1 --depends libxkbcommon0 \
            --depends libdbus-1-3 --depends libfontconfig1 \
            -p "SJTURunningMan_${VERSION}_linux_amd64.deb" \
            -C pkgroot .
      - name: 生成来源证明
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: SJTURunningMan_*_linux_amd64.deb
      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: SJTURunningMan_*_linux_amd64.deb
          if-no-files-found: error

  build-linux-arm64:
    needs: meta
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Write version into config
        run: printf 'global_version = "v%s"\n' '${{ needs.meta.outputs.version }}' > src/config.py
      - name: Install deps
        run: |
          python -m pip install -r requirements.txt pyinstaller
      - name: Build binary
        env:
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: python -m PyInstaller --clean --noconfirm main.spec
      - name: Package deb
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          mkdir -p pkgroot/usr/bin pkgroot/usr/share/applications pkgroot/usr/share/pixmaps
          cp dist/SJTURunningMan pkgroot/usr/bin/sjturunningman
          cp assets/SJTURM.png pkgroot/usr/share/pixmaps/sjturunningman.png
          cat > pkgroot/usr/share/applications/sjturunningman.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=SJTU 校园轻松跑
          Exec=sjturunningman
          Icon=sjturunningman
          Terminal=false
          Categories=Education;
          EOF
          fpm -s dir -t deb -n sjturunningman -v "$VERSION" -a arm64 \
            --maintainer 'Jacky Tang <tang.jie@live.com>' \
            --url 'https://github.com/JackyTJie/SJTURunningMan_Advanced_Edition' \
            --description 'SJTU 校园轻松跑' \
            --depends libgl1 --depends libegl1 --depends libxkbcommon0 \
            --depends libdbus-1-3 --depends libfontconfig1 \
            -p "SJTURunningMan_${VERSION}_linux_arm64.deb" \
            -C pkgroot .
      - name: 生成来源证明
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: SJTURunningMan_*_linux_arm64.deb
      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: SJTURunningMan_*_linux_arm64.deb
          if-no-files-found: error

  # ── 安卓：自签名 universal APK ───────────────────────────────────────────
  # 签名材料放在仓库 Secrets 里（见 CONTRIBUTING / release 说明）：
  #   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD
  #   ANDROID_KEY_ALIAS        / ANDROID_KEY_PASSWORD
  # 缺 secret 时这个作业会直接失败 —— 不退化成未签名包，
  # 因为未签名 APK 用户根本装不上，发出去比构建失败更糟。
  build-android:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK 组件
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 写入签名用 keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64，无法产出可安装的 APK。"
            echo "::error::请在 Settings → Secrets and variables → Actions 配置四个安卓签名 secret："
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: 由 tag 推导 versionName / versionCode
        id: appver
        env:
          V: ${{ needs.meta.outputs.version }}
        run: |
          IFS=. read -r MA MI PA <<< "$V"
          NAME="$V"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME  versionCode=$CODE"

      - name: 构建签名 APK
        env:
          KS_FILE: ${{ runner.temp }}/release.jks
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PAPP_VERSION_NAME="${{ steps.appver.outputs.name }}" \
            -PAPP_VERSION_CODE="${{ steps.appver.outputs.code }}" \
            -PRELEASE_KEYSTORE_FILE="$KS_FILE" \
            -PRELEASE_KEYSTORE_PASSWORD="$KS_PASS" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASS" \
            -Dorg.gradle.java.home="$JAVA_HOME"

      - name: 校验 APK 已签名且版本号与 tag 一致
        # 两道校验，防的是「配置没生效但构建照样成功」这类静默失败：
        #   1. 真的签了名 —— 必须用 apksigner。minSdk 26 高于 v1(JAR) 签名
        #      的适用范围，AGP 只出 V2/V3 签名，META-INF 下没有 .RSA 文件，
        #      拿 unzip 找 META-INF 的写法会误判为未签名。
        #   2. APK 里的 versionName 就是 tag 版本 —— 防止 -P 注入失效后
        #      发出去的包版本号对不上。
        env:
          EXPECTED_NAME: ${{ steps.appver.outputs.name }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/34.0.0"
          test -f "$APK" || { echo "::error::没有产出 $APK"; exit 1; }

          "$BT/apksigner" verify --print-certs "$APK" > /dev/null \
            || { echo "::error::APK 未签名"; exit 1; }

          ACTUAL=$("$BT/aapt2" dump badging "$APK" \
            | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
          if [ "$ACTUAL" != "$EXPECTED_NAME" ]; then
            echo "::error::APK versionName=$ACTUAL，与 tag 的 $EXPECTED_NAME 不一致"
            exit 1
          fi
          echo "签名与版本校验通过：versionName=$ACTUAL"

      - name: 重命名
        env:
          V: ${{ needs.meta.outputs.version }}
        run: cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/SJTURunningMan_${V}_android.apk"

      - name: 生成来源证明
        # 注意：uses 步骤的工作目录是 GITHUB_WORKSPACE，不受上面 defaults.run 影响
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: SJTURunningMan_*_android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: SJTURunningMan_*_android.apk
          if-no-files-found: error

  release:
    needs: [meta, build-windows, build-macos, build-linux-amd64, build-linux-arm64, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 只有这里需要写权限（创建 release 与上传附件）
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成 SHA256 校验文件
        working-directory: artifacts
        # 先删掉同名旧文件：CI 上是全新 runner 不会存在，但万一重跑同一目录，
        # sha256sum * 会把自己的输出也算进去，得到一份自指的校验文件
        run: |
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt

      - name: 生成 Release 正文
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, pathlib

          repo = os.environ["REPO"]
          tag = os.environ["TAG"]
          root = pathlib.Path("artifacts")

          # 平台标签按顺序匹配；没匹配上的归到「其他」
          LABELS = [
              ("_windows.exe",     "Windows (x64)"),
              ("_macOS.dmg",       "macOS（Universal，Intel + Apple Silicon）"),
              ("_linux_amd64.deb", "Linux (x86_64)"),
              ("_linux_arm64.deb", "Linux (aarch64)"),
              ("_android.apk",     "Android（自签名 APK）"),
          ]

          sums = {}
          for line in (root / "SHA256SUMS.txt").read_text().splitlines():
              if line.strip():
                  digest, name = line.split(None, 1)
                  sums[name.strip()] = digest

          def url(name):
              return f"https://github.com/{repo}/releases/download/{tag}/{name}"

          rows, used = [], set()
          for suffix, label in LABELS:
              for name in sorted(sums):
                  if name in used or not name.endswith(suffix):
                      continue
                  used.add(name)
                  rows.append((label, name, sums[name]))
          for name in sorted(sums):
              # 兜底再挡一次：校验文件本身不该出现在下载表里
              if name not in used and name != "SHA256SUMS.txt":
                  rows.append(("其他", name, sums[name]))

          lines = [
              "## 下载",
              "",
              "| 平台 | 文件 | SHA256 |",
              "| --- | --- | --- |",
          ]
          for label, name, digest in rows:
              lines.append(f"| {label} | [{name}]({url(name)}) | `{digest}` |")

          lines += [
              "",
              f"校验值也可以直接下载 [SHA256SUMS.txt]({url('SHA256SUMS.txt')}) 后本地核对。",
              "",
              "### 验证产物",
              "",
              "**1. 核对完整性**",
              "",
              "```bash",
              "# macOS / Linux：与 SHA256SUMS.txt 放在同一目录",
              "sha256sum -c SHA256SUMS.txt",
              "```",
          ]

          # 文件名从实际产物取，不要写死 —— 命名规则变了这里会跟着变
          win = next((n for _, n, _ in rows if n.endswith("_windows.exe")), None)
          if win:
              lines += [
                  "",
                  "```powershell",
                  "# Windows PowerShell",
                  f"Get-FileHash .\\{win} -Algorithm SHA256",
                  "```",
              ]

          lines += [
              "",
              "**2. 核对构建来源**（需要 [gh CLI](https://cli.github.com/) 2.49 及以上）",
              "",
              "```bash",
              f"gh attestation verify <下载的文件> --repo {repo}",
              "```",
              "",
              "这一步校验的是**来源证明**：由本仓库的 `release.yml` 在本次 tag 对应的提交上构建，"
              "而不是从某台本机上传的。证明由 GitHub OIDC 签发，本机无法伪造。",
              "",
              "> 安卓 APK 除了来源证明，还有一层**自签名**（保证同一作者可覆盖升级），两者是不同层面的保证。",
              "",
          ]
          pathlib.Path("RELEASE_BODY.md").write_text("\n".join(lines), encoding="utf-8")
          print("\n".join(lines))
          PY

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.version }}
          # 先生成草稿，人工确认产物齐全后再点发布。
          # 注意：对已发布的 release 重跑会把 draft 设回 true，顺序见文件顶部注释。
          draft: true
          # body_path 的内容会被「前置」，GitHub 自动生成的提交/PR 列表追加在后面。
          # append_body 默认 false，重跑会覆盖旧正文，避免表格重复堆叠。
          body_path: RELEASE_BODY.md
          generate_release_notes: true
          files: artifacts/*
