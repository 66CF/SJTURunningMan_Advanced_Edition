version: 2
updates:
  # 桌面版 Python 依赖（requirements.txt）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # 四个包互相牵连（requests 依赖 urllib3，tenacity 常与 requests 同版本演进），
      # 拆成四个 PR 反而要逐个试构建，合并成一个
      python-deps:
        patterns: ["*"]

  # 发布与 CI 流水线里的 GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["actions/*", "softprops/*", "gradle/*", "android-actions/*"]

  # 安卓 Gradle 依赖（版本目录在 gradle/libs.versions.toml）
  - package-ecosystem: "gradle"
    directory: "/apps/android"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(android)"
    groups:
      # Compose 全家桶必须同进同出：BOM 与各 androidx 模块版本互相约束，
      # 单独升一个基本必然构建失败
      androidx:
        patterns: ["androidx.*", "com.google.android.*"]
      # Kotlin 编译器插件与 kotlin.plugin.compose 共用同一个版本号，
      # 必须一起升，否则 Compose 编译器版本对不上
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
      kotlinx:
        patterns: ["org.jetbrains.kotlinx*"]
      other:
        patterns: ["*"]
        exclude-patterns:
          - "androidx.*"
          - "com.google.android.*"
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"

# 说明：鸿蒙使用 oh-package.json5 + ohpm，不属于 Dependabot 支持的生态，
#      依赖升级需手动在 DevEco Studio 中检查。
#      iOS 依赖由 Xcode 管理，同样不在 Dependabot 覆盖范围内。
