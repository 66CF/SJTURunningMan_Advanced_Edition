[package]
name = "sjturunningman"
version = "4.5.0-beta.4"
edition = "2021"
rust-version = "1.95"
description = "SJTU RunningMan native desktop client"
publish = false
build = "build.rs"

[dependencies]
slint = { version = "=1.18.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2", "unstable-fontique-011"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "multipart", "gzip", "rustls-tls"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"

[build-dependencies]
slint-build = "=1.18.0"
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
